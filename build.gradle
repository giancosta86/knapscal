buildscript {
    repositories {
        //TODO! Del this!
        mavenLocal()

        mavenCentral()
    }

    dependencies {
        classpath 'info.gianlucacosta.aurora:aurora:10.0.0-SNAPSHOT'
    }
}


apply plugin: 'scala'
apply plugin: 'application'
apply plugin: 'info.gianlucacosta.aurora'

group = 'info.gianlucacosta.knapscal'
archivesBaseName = 'knapscal'
version = '4.0.0-SNAPSHOT'


description = 'ScalaFX didactic application for the Knapsack problem'


mainClassName = 'info.gianlucacosta.knapscal.app.App'


dependencies {
    compile 'org.scala-lang:scala-library:2.11.8'

    compile 'info.gianlucacosta.knapscal:knapscal-core:2.0.0-SNAPSHOT'
    compile 'info.gianlucacosta.eighthbridge:eighthbridge:9.0.0-SNAPSHOT'
    compile 'info.gianlucacosta.helios:helios-fx:7.0.0-SNAPSHOT'
}


aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }
}